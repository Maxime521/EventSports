<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements — EventSport</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">Event<span>Sport</span></a>
  <nav>
    <a href="index.html">Accueil</a>
    <a class="btn" href="create.html" id="open-create" style="text-decoration:none; display:inline-block;">+ Créer un événement</a>
    <div id="auth-nav" style="display:flex; gap:6px; align-items:center;"></div>
  </nav>
</header>

<div id="page-content">
  <!-- rempli par JS -->
</div>

<script type="module">
import { db, auth, signOut, onAuthStateChanged } from './firebase-config.js';
import { collection, query, orderBy, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

// ===== GESTION AUTH HEADER =====
const authNav = document.getElementById('auth-nav');
const openCreateBtn = document.getElementById('open-create');

function updateAuthUI(user) {
  if (user) {
    openCreateBtn.style.display = 'inline-block';
    
    authNav.innerHTML = `
      <a href="dashboard.html" class="btn-outline" style="text-decoration:none; padding:6px 16px; font-size:12px; border-width:1.5px; border-color:var(--accent);">
        👤 Mon Profil
      </a>
      <button id="logout-btn" class="btn-outline" style="padding:6px 16px; font-size:12px; border-width:1.5px; cursor:pointer;">
        Déconnexion
      </button>
    `;
    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      try {
        await signOut(auth);
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Erreur déconnexion:', error);
      }
    });
  } else {
    openCreateBtn.style.display = 'none';
    
    authNav.innerHTML = `
      <a href="login.html" class="btn-outline" style="text-decoration:none; padding:6px 16px; font-size:12px; border-width:1.5px;">Connexion</a>
      <a href="register.html" class="btn" style="text-decoration:none; padding:6px 16px; font-size:12px; border-width:1.5px;">S'inscrire</a>
    `;
  }
}

onAuthStateChanged(auth, (user) => {
  updateAuthUI(user);
  if (eventId && currentEvent) {
    render();
  }
});

// ===== RESTE DU CODE EVENT =====
const REGIONS = [
  "Auvergne-Rhône-Alpes","Bourgogne-Franche-Comté","Bretagne","Centre-Val de Loire",
  "Corse","Grand Est","Hauts-de-France","Île-de-France","Normandie",
  "Nouvelle-Aquitaine","Occitanie","Pays de la Loire","Provence-Alpes-Côte d'Azur","Outre-mer"
];

const params = new URLSearchParams(window.location.search);
const eventId = params.get('id');
const page = document.getElementById('page-content');

let currentEvent = null;
let isAdmin = false;

let allEvents = [];
let currentRegionFilter = 'all';

document.title = eventId ? "Gérer l'événement — EventSport" : "Tous les événements — EventSport";

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function fmtDate(d, t, short) {
  if(!d) return 'Date non précisée';
  const date = new Date(d + 'T' + (t || '00:00'));
  const options = short
    ? { weekday:'short', day:'numeric', month:'short' }
    : { weekday:'long', day:'numeric', month:'long', year:'numeric' };
  let str = date.toLocaleDateString('fr-FR', options);
  if(t) str += ' à ' + t;
  return str;
}

// ===== FONCTIONS UTILES POUR LES PARTICIPANTS =====
function normalizeParticipants(participants) {
  if (!participants || !Array.isArray(participants)) return [];
  return participants.map(p => {
    // Si c'est une string (ancien format), la convertir en objet
    if (typeof p === 'string') {
      return { name: p, email: p };
    }
    // Si c'est un objet avec name mais pas email
    if (typeof p === 'object' && p.name && !p.email) {
      return { ...p, email: p.name };
    }
    return p;
  });
}

function getParticipantDisplayName(p) {
  if (typeof p === 'string') return p;
  return p.name || p.email || 'Anonyme';
}

function getParticipantEmail(p) {
  if (typeof p === 'string') return p;
  return p.email || p.name || '';
}

function isCurrentUserParticipant(participants) {
  if (!auth.currentUser) return false;
  const email = auth.currentUser.email;
  return participants.some(p => getParticipantEmail(p) === email);
}

function getParticipantIndexByEmail(participants, email) {
  return participants.findIndex(p => getParticipantEmail(p) === email);
}

/* ============================================================
   MODE LISTE — pas de ?id dans l'URL : tous les événements
   ============================================================ */

function loadEventsList() {
  page.className = 'section';
  page.innerHTML = `<div class="grid"><div class="loading-spinner"></div></div>`;

  const q = query(collection(db, "events"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    allEvents = [];
    snapshot.forEach((doc) => {
      const data = doc.data();
      allEvents.push({
        id: doc.id,
        ...data,
        participants: normalizeParticipants(data.participants || [])
      });
    });
    renderEventsList();
  }, (error) => {
    console.error("Erreur de chargement:", error);
    page.innerHTML = `
      <div class="section">
        <div class="empty-state">
          <h3>Erreur de chargement</h3>
          <p>Impossible de charger les événements. Vérifie ta connexion à Firebase.</p>
        </div>
      </div>
    `;
  });
}

function renderEventsList() {
  page.className = 'section';

  const presentRegions = REGIONS.filter(r => allEvents.some(e => e.region === r));
  const filtered = currentRegionFilter === 'all'
    ? allEvents
    : allEvents.filter(e => e.region === currentRegionFilter);

  page.innerHTML = `
    <div class="section-head">
      <div>
        <div class="eyebrow">Tous les événements</div>
        <h2>Trouve ton prochain match</h2>
      </div>
    </div>
    <div class="filters" id="region-filters">
      <button class="filter-chip ${currentRegionFilter === 'all' ? 'active' : ''}" data-region="all">Toutes les régions</button>
      ${presentRegions.map(r => `
        <button class="filter-chip ${currentRegionFilter === r ? 'active' : ''}" data-region="${escapeHtml(r)}">${escapeHtml(r)}</button>
      `).join('')}
    </div>
    <div class="grid" id="events-grid" style="margin-top:24px;"></div>
  `;

  page.querySelectorAll('#region-filters [data-region]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRegionFilter = btn.dataset.region;
      renderEventsList();
    });
  });

  const grid = document.getElementById('events-grid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <h3>${allEvents.length === 0 ? 'Aucun événement' : 'Aucun événement dans cette région'}</h3>
      <p>${allEvents.length === 0 ? 'Sois le premier à créer un tournoi !' : 'Essaie une autre région ou crée un nouvel événement.'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = '';

  filtered.forEach((e, i) => {
    const participants = normalizeParticipants(e.participants || []);
    const pct = Math.min(100, Math.round((participants.length / e.max) * 100));
    const full = participants.length >= e.max;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="sport-tag">${escapeHtml(e.sport)}</span>
        <span class="card-num">${String(i + 1).padStart(2, '0')}</span>
      </div>
      <div class="card-body">
        <h3>${escapeHtml(e.name)}</h3>
        <div class="card-meta">
          <span><b>Région :</b> ${escapeHtml(e.region || 'Non précisée')}</span>
          <span><b>Quand :</b> ${fmtDate(e.date, e.time, true)}</span>
          <span><b>Où :</b> ${escapeHtml(e.location || 'Non précisé')}</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">
            <span>${participants.length} / ${e.max} inscrits</span>
            <span>${full ? 'Complet' : pct + '%'}</span>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <a class="btn-outline" href="event.html?id=${e.id}" style="text-decoration:none; text-align:center;">Détails</a>
        <a class="btn" href="event.html?id=${e.id}" style="text-decoration:none; text-align:center; ${full ? 'opacity:.5; pointer-events:none;' : ''}">${full ? 'Complet' : 'Rejoindre'}</a>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ============================================================
   MODE GESTION — ?id=... : détail / gestion d'un événement
   ============================================================ */

function isUserAdmin(eventData) {
  if (!auth.currentUser) return false;
  return eventData.createdBy === auth.currentUser.uid;
}

async function loadEvent() {
  const eventRef = doc(db, "events", eventId);
  onSnapshot(eventRef, (docSnap) => {
    if (docSnap.exists()) {
      currentEvent = {
        id: docSnap.id,
        ...docSnap.data(),
        participants: normalizeParticipants(docSnap.data().participants || [])
      };
      isAdmin = isUserAdmin(currentEvent);
      render();
    } else {
      renderNotFound();
    }
  });
}

function renderNotFound() {
  page.className = 'page';
  page.innerHTML = `
    <div class="not-found">
      <h1>Événement introuvable</h1>
      <p>Cet événement n'existe pas ou a été supprimé.</p>
      <a class="btn" href="event.html">Voir tous les événements</a>
    </div>
  `;
}

function render() {
  const e = currentEvent;
  if (!e) return;

  page.className = 'page';

  const participants = normalizeParticipants(e.participants || []);
  const pct = Math.min(100, Math.round((participants.length / e.max) * 100));
  const full = participants.length >= e.max;
  const shareUrl = window.location.origin + window.location.pathname + '?id=' + eventId;

  const currentUserEmail = auth.currentUser?.email || '';
  const isParticipant = isCurrentUserParticipant(participants);

  let roleText = '';
  let roleClass = '';

  if (isAdmin) {
    roleText = '👑 Admin - Tu as tous les droits de gestion';
    roleClass = 'role-admin';
  } else if (isParticipant) {
    roleText = '✅ Membre - Tu es inscrit à cet événement';
    roleClass = 'role-member';
  } else {
    roleText = '👤 Visiteur - Inscris-toi pour rejoindre l\'événement';
    roleClass = 'role-visitor';
  }

  page.innerHTML = `
    <div class="role-banner ${roleClass}">
      <span>${roleText}</span>
      ${isAdmin ? `<span style="font-size:11px; opacity:0.7;">Créé par ${escapeHtml(e.createdByEmail || 'vous')}</span>` : ''}
    </div>

    <div class="eyebrow">
      <span class="sport-tag">${escapeHtml(e.sport)}</span>
      <span class="status-pill ${full ? 'status-full' : 'status-open'}">${full ? 'Complet' : 'Inscriptions ouvertes'}</span>
    </div>
    <h1>${escapeHtml(e.name)}</h1>
    <div class="meta-line">
      <b>${escapeHtml(e.format)}</b> · ${escapeHtml(e.region || 'Région non précisée')} · ${fmtDate(e.date, e.time)} · ${escapeHtml(e.location || 'Lieu non précisé')}
    </div>

    <div class="grid-2">
      <div>
        <div class="card">
          <div class="card-head">
            <h3>Participants (${participants.length}/${e.max})</h3>
            ${isAdmin ? `<span style="font-size:12px; color:var(--accent-dark);">Gestion active</span>` : ''}
          </div>
          <div class="card-body">
            <div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              <div class="progress-label">
                <span>${participants.length} / ${e.max} inscrits</span>
                <span>${full ? 'Complet' : pct + '% des places prises'}</span>
              </div>
            </div>
            <div class="participants-list" id="participants-list"></div>

            ${!full && auth.currentUser ? `
              <div class="add-participant">
                <input type="text" id="new-participant" placeholder="Ton nom" value="${isParticipant ? getParticipantDisplayName(participants.find(p => getParticipantEmail(p) === currentUserEmail)) : ''}" autofocus>
                <button class="btn" id="add-participant-btn">${isParticipant ? 'Mettre à jour' : 'Rejoindre'}</button>
              </div>
            ` : ''}
            
            ${!auth.currentUser ? `
              <div style="text-align:center; padding:12px 0;">
                <a href="login.html" class="btn" style="text-decoration:none;">Se connecter pour rejoindre</a>
              </div>
            ` : ''}
            
            ${full ? `<div class="empty-msg">Plus de places disponibles.</div>` : ''}
          </div>
        </div>

        ${e.desc ? `
          <div class="card">
            <div class="card-head"><h3>Description</h3></div>
            <div class="card-body">
              <p style="font-size:14px; color:var(--muted);">${escapeHtml(e.desc)}</p>
            </div>
          </div>
        ` : ''}
      </div>

      <div>
        <div class="card">
          <div class="card-head"><h3>Partager</h3></div>
          <div class="card-body">
            <div class="field">
              <label>Lien public</label>
              <div class="share-box">
                <input type="text" readonly value="${shareUrl}" id="share-input">
                <button class="copy-btn" data-copy="share-input">Copier</button>
              </div>
            </div>
          </div>
        </div>

        ${isAdmin ? renderAdminInfo(e) : renderMemberInfo(e, isParticipant)}

        ${!isAdmin && isParticipant ? `
          <div class="card">
            <div class="card-head"><h3>Se retirer</h3></div>
            <div class="card-body">
              <p style="font-size:13px; color:var(--muted);">Tu peux te retirer de cet événement à tout moment.</p>
              <button class="btn-danger" id="leave-event" style="width:100%; justify-content:center;">Me retirer de l'événement</button>
            </div>
          </div>
        ` : ''}

        ${isAdmin ? `
          <div class="card">
            <div class="card-head"><h3>Zone dangereuse</h3></div>
            <div class="card-body">
              <p style="font-size:13px; color:var(--muted);">Supprimer cet événement le retirera définitivement de la liste, pour tout le monde.</p>
              <button class="btn-danger" id="delete-event" style="width:100%; justify-content:center;">Supprimer l'événement</button>
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  renderParticipants(e);
  attachHandlers(e);
}

function renderAdminInfo(e) {
  const participants = normalizeParticipants(e.participants || []);
  return `
    <div class="card">
      <div class="card-head">
        <h3>✏️ Gestion avancée (Admin)</h3>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Nom de l'événement</label>
          <input type="text" id="f-name" value="${escapeHtml(e.name)}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Sport</label>
            <select id="f-sport">
              ${['Ping-pong','Football','Basketball','Tennis','Padel','Volleyball','Autre'].map(s =>
                `<option ${s===e.sport?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Format</label>
            <select id="f-format">
              ${['Tournoi élimination directe','Match simple','Championnat (poules)','Tournoi par équipes'].map(s =>
                `<option ${s===e.format?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="f-date" value="${e.date || ''}">
          </div>
          <div class="field">
            <label>Heure</label>
            <input type="time" id="f-time" value="${e.time || ''}">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Région</label>
            <select id="f-region">
              ${REGIONS.map(r => `<option ${r===e.region?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Lieu</label>
            <input type="text" id="f-location" value="${escapeHtml(e.location || '')}">
          </div>
        </div>
        <div class="field">
          <label>Places maximum</label>
          <input type="number" id="f-max" min="${participants.length}" value="${e.max}">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="f-desc">${escapeHtml(e.desc || '')}</textarea>
        </div>
        <button class="btn" id="save-info" style="width:100%; justify-content:center;">💾 Enregistrer les modifications</button>
      </div>
    </div>
  `;
}

function renderMemberInfo(e, isParticipant) {
  return `
    <div class="card">
      <div class="card-head">
        <h3>📋 Informations</h3>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Nom</label>
          <input type="text" value="${escapeHtml(e.name)}" disabled>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Sport</label>
            <input type="text" value="${escapeHtml(e.sport)}" disabled>
          </div>
          <div class="field">
            <label>Format</label>
            <input type="text" value="${escapeHtml(e.format)}" disabled>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Date</label>
            <input type="text" value="${fmtDate(e.date, e.time)}" disabled>
          </div>
          <div class="field">
            <label>Heure</label>
            <input type="text" value="${e.time || 'Non précisée'}" disabled>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Région</label>
            <input type="text" value="${escapeHtml(e.region || 'Non précisée')}" disabled>
          </div>
          <div class="field">
            <label>Lieu</label>
            <input type="text" value="${escapeHtml(e.location || 'Non précisé')}" disabled>
          </div>
        </div>
        <div class="field">
          <label>Places</label>
          <input type="text" value="${e.participants.length} / ${e.max}" disabled>
        </div>
        ${e.createdByEmail ? `
          <div class="field">
            <label>Créé par</label>
            <input type="text" value="${escapeHtml(e.createdByEmail)}" disabled>
          </div>
        ` : ''}
        ${isParticipant ? `
          <div style="margin-top:8px; padding:10px; background:var(--green-light); border-radius:var(--radius-sm); text-align:center; color:var(--green); font-weight:600;">
            ✅ Tu es inscrit à cet événement
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderParticipants(e) {
  const list = document.getElementById('participants-list');
  if (!list) return;
  
  list.innerHTML = '';
  const participants = normalizeParticipants(e.participants || []);
  const currentUserEmail = auth.currentUser?.email || '';

  if(participants.length === 0){
    list.innerHTML = '<div class="empty-msg">Aucun participant pour l\'instant.</div>';
    return;
  }

  participants.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'participant-row';
    const pEmail = getParticipantEmail(p);
    const pName = getParticipantDisplayName(p);
    const isCurrentUser = pEmail === currentUserEmail;
    
    row.innerHTML = `
      <span class="pname">
        <span class="pnum">${idx+1}</span>
        ${escapeHtml(pName)}
        ${isCurrentUser ? ' <span style="font-size:11px; color:var(--green);">(toi)</span>' : ''}
      </span>
      ${isAdmin && !isCurrentUser ? `<button class="remove-btn" data-remove="${idx}">Retirer</button>` : ''}
      ${!isAdmin && isCurrentUser ? `<button class="leave-btn" data-leave="${idx}">Se retirer</button>` : ''}
    `;
    list.appendChild(row);
  });

  // Admin : retirer n'importe qui (sauf lui-même)
  if(isAdmin){
    list.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idx = parseInt(btn.dataset.remove);
        const newParticipants = [...participants];
        const removed = newParticipants.splice(idx, 1);
        const removedName = getParticipantDisplayName(removed[0]);
        if(confirm(`Retirer "${removedName}" de l'événement ?`)) {
          try {
            const eventRef = doc(db, "events", eventId);
            await updateDoc(eventRef, {
              participants: newParticipants
            });
          } catch (error) {
            console.error("Erreur:", error);
            alert("Erreur lors du retrait.");
          }
        }
      });
    });
  }

  // Non-admin : se retirer soi-même
  list.querySelectorAll('[data-leave]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm("Tu es sur le point de te retirer de cet événement. Continuer ?")) {
        try {
          const eventRef = doc(db, "events", eventId);
          const currentUserEmail = auth.currentUser?.email;
          const newParticipants = participants.filter(p => getParticipantEmail(p) !== currentUserEmail);
          await updateDoc(eventRef, {
            participants: newParticipants
          });
          alert("Tu as été retiré de l'événement.");
          window.location.reload();
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors du retrait.");
        }
      }
    });
  });
}

function attachHandlers(e) {
  // Copy buttons
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.copy);
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        const old = btn.textContent;
        btn.textContent = 'Copié !';
        setTimeout(() => btn.textContent = old, 1500);
      }).catch(() => {
        document.execCommand('copy');
      });
    });
  });

  // Add/Join participant
  const addBtn = document.getElementById('add-participant-btn');
  if(addBtn){
    addBtn.addEventListener('click', async () => {
      const input = document.getElementById('new-participant');
      const name = input.value.trim();
      if(!name){ alert('Entre ton nom.'); return; }

      const participants = normalizeParticipants(e.participants || []);
      if(participants.length >= e.max){ alert('Plus de places disponibles.'); return; }

      const currentUserEmail = auth.currentUser?.email;
      if (!currentUserEmail) {
        alert('Tu dois être connecté.');
        return;
      }

      // Vérifier si l'utilisateur est déjà inscrit
      const existingIndex = getParticipantIndexByEmail(participants, currentUserEmail);
      
      if (existingIndex !== -1) {
        // Mettre à jour le nom
        const newParticipants = [...participants];
        newParticipants[existingIndex] = { 
          ...newParticipants[existingIndex], 
          name: name 
        };
        try {
          const eventRef = doc(db, "events", eventId);
          await updateDoc(eventRef, {
            participants: newParticipants
          });
          alert('Ton nom a été mis à jour !');
          input.value = '';
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de la mise à jour.");
        }
      } else {
        // Ajouter le participant
        try {
          const eventRef = doc(db, "events", eventId);
          await updateDoc(eventRef, {
            participants: [...participants, { name: name, email: currentUserEmail }]
          });
          input.value = '';
          alert('Inscription réussie !');
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de l'inscription.");
        }
      }
    });

    document.getElementById('new-participant')?.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter') addBtn.click();
    });
  }

  // Admin: Save info
  if(isAdmin){
    const saveBtn = document.getElementById('save-info');
    if(saveBtn){
      saveBtn.addEventListener('click', async () => {
        const name = document.getElementById('f-name').value.trim();
        if(!name){ alert("Le nom de l'événement est obligatoire."); return; }
        const max = parseInt(document.getElementById('f-max').value) || 1;
        const participants = normalizeParticipants(e.participants || []);

        if(max < participants.length){
          alert(`Impossible : il y a déjà ${participants.length} participants inscrits.`);
          return;
        }

        try {
          const eventRef = doc(db, "events", eventId);
          await updateDoc(eventRef, {
            name: name,
            sport: document.getElementById('f-sport').value,
            format: document.getElementById('f-format').value,
            date: document.getElementById('f-date').value,
            time: document.getElementById('f-time').value,
            region: document.getElementById('f-region').value,
            location: document.getElementById('f-location').value.trim(),
            max: max,
            desc: document.getElementById('f-desc').value.trim()
          });
          alert('Événement mis à jour !');
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de la mise à jour.");
        }
      });
    }

    // Delete event
    const deleteBtn = document.getElementById('delete-event');
    if(deleteBtn){
      deleteBtn.addEventListener('click', async () => {
        if(!confirm("Supprimer définitivement cet événement ? Cette action est irréversible.")) return;
        try {
          await deleteDoc(doc(db, "events", eventId));
          window.location.href = 'event.html';
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de la suppression.");
        }
      });
    }
  }

  // Non-admin: Leave event
  const leaveBtn = document.getElementById('leave-event');
  if(leaveBtn){
    leaveBtn.addEventListener('click', async () => {
      if(!confirm("Tu es sur le point de te retirer de cet événement. Continuer ?")) return;
      try {
        const eventRef = doc(db, "events", eventId);
        const currentUserEmail = auth.currentUser?.email;
        const participants = normalizeParticipants(e.participants || []);
        const newParticipants = participants.filter(p => getParticipantEmail(p) !== currentUserEmail);
        await updateDoc(eventRef, {
          participants: newParticipants
        });
        alert("Tu as été retiré de l'événement.");
        window.location.reload();
      } catch (error) {
        console.error("Erreur:", error);
        alert("Erreur lors du retrait.");
      }
    });
  }
}

// ===== LANCEMENT =====
if (!eventId) {
  loadEventsList();
} else {
  loadEvent();
}
</script>
